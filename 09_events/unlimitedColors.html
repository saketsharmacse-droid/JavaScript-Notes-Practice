<!-- we will create a simple project that changes the background color continuouslu unless stopped -->
<!-- usually colors are a combination of hexadecimal values which we shall take into consideration. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Colors</title>
</head>
<body style="background-color: #212121; color: #fff">
    <h1>Press the button below to start the color loop and press stop to cease the flow!</h1>
    <button id="start">START</button>
    <button id="stop">STOP</button>

    <script>

        //console.log(Math.floor(Math.random() * 10 + 1))

        const randomColor = function(){
            const hex = "0123456789ABCDEF"; //range of hexadecimal numbers used.

            let color = "#";
            for(let i = 0; i < 6; i++){

                color += hex[Math.floor(Math.random() * 16)];

            }
            return color;
        }

        let intervalId;

        const startColorChanging = function() {
            if(!intervalId){
                intervalId = setInterval(changebgColor, 1000);

            }
            function changebgColor() {
                document.body.style.backgroundColor = randomColor();
            }
        }

        const  stopColorChanging = function() {
            clearInterval(intervalId);
            intervalId = null;
        }

        document.querySelector('#start').addEventListener('click', startColorChanging);

        document.querySelector('#stop').addEventListener('click', stopColorChanging);






    </script>
    
</body>
</html>
