<!-- bind samajhne ke liye thoda sa react ke upar jayenge. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>
<body>
    <button>Button Clicked</button>
    
</body>
<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "https://localhost:300"

            //react mei virtual dom hota hai.
            //humein chahiye ki button click hone ke baad kuch print ho.

            document
                .querySelector('button')
                .addEventListener('click', this.handleClick
                .bind(this))
        }
        handleClick(){
            console.log("button clicked");
            console.log(this); //<button>Button Clicked </button>
            //humein binding krni padegi taaki upar ke bhi methods ka reference le paao.
            console.log(this.server);
        }

    }

    const app = new React();
</script>
</html>
